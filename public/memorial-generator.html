<!DOCTYPE html>
<!--
  数字纪念页生成工具 - 单文件版
  使用：npm run start 后访问 http://localhost:3000/memorial-generator.html
  或直接双击打开本文件（需联网加载 CDN，推荐用本地服务访问）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字纪念页生成工具</title>
  <!-- 思源宋体 / 系统衬线，庄重感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Ant Design 5 CSS（与 React 18 兼容较好） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.22.0/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.22.0/dist/antd.min.css" />
  <!-- Quill 富文本 -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #f8f6f2;
      --color-card: #fffefb;
      --color-text: #3d3d3d;
      --color-muted: #6b6b6b;
      --color-accent: #7a9eb8;
      --color-border: #e0ddd6;
      --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-serif);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }
    #root { min-height: 100vh; }
    /* 加载状态 */
    .memorial-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
      color: var(--color-muted);
    }
    /* 编辑页布局 */
    .memorial-editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      .memorial-editor { grid-template-columns: 1fr; }
    }
    .memorial-editor .form-panel {
      background: var(--color-card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--color-border);
    }
    .memorial-editor .preview-panel {
      background: var(--color-card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--color-border);
      position: sticky;
      top: 24px;
      max-height: calc(100vh - 48px);
      overflow: auto;
    }
    .memorial-editor .form-title,
    .memorial-editor .preview-title {
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--color-text);
      font-size: 18px;
    }
    /* 预览区内的纪念卡样式（与最终纪念页一致） */
    .memorial-card {
      font-family: var(--font-serif);
      color: var(--color-text);
      padding: 20px 0;
    }
    .memorial-card .name {
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
    }
    .memorial-card .dates {
      text-align: center;
      color: var(--color-muted);
      font-size: 14px;
      margin-bottom: 20px;
    }
    .memorial-card .bio {
      font-size: 14px;
      line-height: 1.8;
      color: var(--color-text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .memorial-card .bio img { max-width: 100%; height: auto; border-radius: 8px; }
    .memorial-card .photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .memorial-card .photos img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }
    /* 预览页（纪念页 + 二维码） */
    .memorial-preview-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
      padding-right: 200px;
      min-height: 100vh;
      background: var(--color-card);
      position: relative;
    }
    @media (max-width: 600px) {
      .memorial-preview-page { padding-right: 24px; }
      .memorial-preview-page .qr-area { position: static; margin-bottom: 20px; }
    }
    .memorial-preview-page .scan-hint {
      text-align: center;
      color: var(--color-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .memorial-preview-page .qr-area {
      position: absolute;
      top: 24px;
      right: 24px;
      text-align: center;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .memorial-preview-page #qrcode-container canvas,
    .memorial-preview-page #qrcode-container img { display: block; margin: 0 auto; }
    .memorial-preview-page .save-qr-btn { margin-top: 12px; width: 100%; }
    /* Quill 与 antd 同屏时的样式 */
    .memorial-editor .ql-container { font-family: var(--font-serif); min-height: 120px; }
    .memorial-editor .ant-form-item { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="memorial-loading">加载中…</div>
  </div>

  <!--
    ========== 请替换为您的阿里云 OSS 配置 ==========
    使用方式：STS 临时授权 或 服务端签名后前端直传。
    数据命名规则：
      - 表单 JSON：memorial_{timestamp}.json
      - 照片目录：memorial_{timestamp}/photo_1.jpg, photo_2.jpg ...
    未配置时可使用「模拟生成」在本地测试。
  -->
  <script>
    window.OSS_CONFIG = {
      // region: 'oss-cn-hangzhou',   // 请替换为您的 Region
      // bucket: 'your-bucket-name',  // 请替换为您的 Bucket
      // accessKeyId: '您的 AccessKey ID',
      // 若使用 STS：stsToken、accessKeySecret 由后端接口返回，不要写在前端
      // 若使用签名 URL：由后端生成 put 签名 URL，前端 put 上传
      isConfigured: false
    };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/locale/zh-cn.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5.22.0/dist/antd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>dayjs.locale('zh-cn');</script>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useCallback } = React;
    const { Form, Input, DatePicker, Button, Upload, message, Spin, ConfigProvider } = antd;
    const dayjs = window.dayjs;

    // ---------- 路由：Hash 区分编辑 / 预览 ----------
    function useHashRoute() {
      const [path, setPath] = useState(() => {
        const h = window.location.hash.slice(1) || '/';
        const [p, q] = h.split('?');
        return { path: p || '/', query: q || '' };
      });
      useEffect(() => {
        const onHash = () => {
          const h = window.location.hash.slice(1) || '/';
          const [p, q] = h.split('?');
          setPath({ path: p || '/', query: q || '' });
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const setHash = (pathname, query) => {
        window.location.hash = query ? `${pathname}?${query}` : pathname;
      };
      const getQueryId = () => {
        const q = path.query;
        if (!q) return null;
        const m = q.match(/id=([^&]+)/);
        return m ? decodeURIComponent(m[1]) : null;
      };
      return [path, setHash, getQueryId];
    }

    // ---------- 本地模拟存储 key ----------
    const SIMULATE_PREFIX = 'memorial_simulate_';

    // ---------- 富文本编辑器封装（Quill） ----------
    function RichTextEditor({ value, onChange, placeholder }) {
      const containerRef = useRef(null);
      const editorRef = useRef(null);
      const mounted = useRef(false);

      useEffect(() => {
        if (!containerRef.current || mounted.current) return;
        const quill = new Quill(containerRef.current, {
          theme: 'snow',
          modules: {
            toolbar: {
              container: [
                ['bold'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                ['link', 'image'],
                ['clean']
              ],
              handlers: {
                image: function imageHandler() {
                  const input = document.createElement('input');
                  input.setAttribute('type', 'file');
                  input.setAttribute('accept', 'image/*');
                  input.onchange = () => {
                    const file = input.files && input.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                      const url = e.target && e.target.result;
                      if (url) {
                        const range = quill.getSelection(true);
                        quill.insertEmbed(range.index, 'image', url, 'user');
                        quill.setSelection(range.index + 1);
                      }
                    };
                    reader.readAsDataURL(file);
                  };
                  input.click();
                }
              }
            }
          }
        });
        if (value) quill.root.innerHTML = value;
        quill.on('text-change', () => {
          if (onChange) onChange(quill.root.innerHTML);
        });
        editorRef.current = quill;
        mounted.current = true;
        return () => {
          mounted.current = false;
          editorRef.current = null;
        };
      }, []);

      useEffect(() => {
        if (editorRef.current && value !== undefined && editorRef.current.root.innerHTML !== value) {
          editorRef.current.root.innerHTML = value || '';
        }
      }, [value]);

      return <div ref={containerRef} style={{ background: '#fff', borderRadius: 8 }} />;
    }

    // ---------- 纪念卡展示组件（用于编辑区预览 + 预览页） ----------
    function MemorialCard({ data }) {
      if (!data) return <div style={{ color: '#999' }}>填写左侧表单即可预览</div>;
      const { name, birthDate, deathDate, biography, photoList = [] } = data;
      const birthStr = birthDate ? dayjs(birthDate).format('YYYY年MM月DD日') : '——';
      const deathStr = deathDate ? dayjs(deathDate).format('YYYY年MM月DD日') : '——';
      return (
        <div className="memorial-card">
          {name && <div className="name">{name}</div>}
          <div className="dates">{birthStr} 至 {deathStr}</div>
          {biography && (
            <div className="bio" dangerouslySetInnerHTML={{ __html: biography }} />
          )}
          {photoList.length > 0 && (
            <div className="photos">
              {photoList.map((url, i) => (
                <img key={i} src={url} alt="" />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ---------- 编辑页 ----------
    function EditorPage({ onGenerate, onSimulate }) {
      const [form] = Form.useForm();
      const [bioHtml, setBioHtml] = useState('');
      const [fileList, setFileList] = useState([]);
      const [submitting, setSubmitting] = useState(false);
      const [simulating, setSimulating] = useState(false);

      const values = Form.useWatch([], form) || {};
      const previewData = {
        name: values.name,
        birthDate: values.birthDate?.valueOf?.() ?? values.birthDate,
        deathDate: values.deathDate?.valueOf?.() ?? values.deathDate,
        biography: bioHtml,
        photoList: fileList.map(f => f.thumbUrl || f.url || (f.originFileObj && URL.createObjectURL(f.originFileObj))).filter(Boolean)
      };

      const normFile = (e) => {
        if (Array.isArray(e)) return e;
        return e?.fileList ?? [];
      };

      const handleGenerate = async () => {
        try {
          await form.validateFields(['name']);
        } catch {
          return;
        }
        if (!window.OSS_CONFIG || !window.OSS_CONFIG.isConfigured) {
          message.warning('尚未配置 OSS，请使用「模拟生成」进行测试');
          return;
        }
        setSubmitting(true);
        try {
          const id = 'memorial_' + Date.now();
          const formValues = form.getFieldsValue();
          const payload = {
            name: formValues.name,
            birthDate: formValues.birthDate?.valueOf?.(),
            deathDate: formValues.deathDate?.valueOf?.(),
            biography: bioHtml,
            photoUrls: [] // 上传后由 OSS 返回的 URL 填充
          };
          // TODO: 1) 上传图片到 OSS memorial_{id}/photo_1.jpg ...
          // TODO: 2) 将 payload 保存为 JSON 上传到 OSS memorial_{id}.json
          // 此处预留：调用您的 OSS 直传逻辑后，再 onGenerate(id, payload)
          message.info('OSS 未实现上传逻辑，请配置并实现上传后重试');
        } finally {
          setSubmitting(false);
        }
      };

      const handleSimulate = async () => {
        try {
          await form.validateFields(['name']);
        } catch {
          return;
        }
        setSimulating(true);
        try {
          const id = 'memorial_' + Date.now();
          const formValues = form.getFieldsValue();
          const photoUrls = [];
          for (let i = 0; i < fileList.length; i++) {
            const f = fileList[i];
            const file = f.originFileObj || f;
            if (file && file instanceof File) {
              const dataUrl = await readFileAsDataURL(file);
              photoUrls.push(dataUrl);
            } else if (f.thumbUrl || f.url) {
              photoUrls.push(f.thumbUrl || f.url);
            }
          }
          const payload = {
            name: formValues.name,
            birthDate: formValues.birthDate?.valueOf?.(),
            deathDate: formValues.deathDate?.valueOf?.(),
            biography: bioHtml,
            photoUrls
          };
          window.localStorage.setItem(SIMULATE_PREFIX + id, JSON.stringify(payload));
          onSimulate(id);
        } catch (e) {
          message.error('模拟生成失败');
        } finally {
          setSimulating(false);
        }
      };

      return (
        <div className="memorial-editor">
          <div className="form-panel">
            <h1 style={{ fontSize: 22, marginBottom: 8, color: 'var(--color-text)' }}>数字纪念页生成工具</h1>
            <div className="form-title">填写纪念信息</div>
            <Form form={form} layout="vertical" initialValues={{}}>
              <Form.Item name="name" label="逝者姓名" rules={[{ required: true, message: '请填写姓名' }]}>
                <Input placeholder="请输入姓名" />
              </Form.Item>
              <Form.Item name="birthDate" label="出生日期">
                <DatePicker style={{ width: '100%' }} placeholder="选择出生日期" />
              </Form.Item>
              <Form.Item name="deathDate" label="逝世日期">
                <DatePicker style={{ width: '100%' }} placeholder="选择逝世日期" />
              </Form.Item>
              <Form.Item label="生平介绍">
                <RichTextEditor value={bioHtml} onChange={setBioHtml} placeholder="支持加粗、换行、插入图片" />
              </Form.Item>
              <Form.Item
                name="photos"
                label="照片（可拖拽排序：使用下方按钮调整顺序）"
                valuePropName="fileList"
                getValueFromEvent={normFile}
              >
                <Upload
                  listType="picture-card"
                  fileList={fileList}
                  onChange={({ fileList: fl }) => setFileList(fl)}
                  beforeUpload={() => false}
                  accept="image/*"
                  multiple
                >
                  {fileList.length >= 9 ? null : '+ 上传'}
                </Upload>
              </Form.Item>
              {fileList.length > 1 && (
                <Form.Item label="调整顺序（上移/下移）">
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {fileList.map((f, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <Button
                          size="small"
                          disabled={i === 0}
                          onClick={() => {
                            const next = [...fileList];
                            [next[i - 1], next[i]] = [next[i], next[i - 1]];
                            setFileList(next);
                          }}
                        >
                          上移
                        </Button>
                        <Button
                          size="small"
                          disabled={i === fileList.length - 1}
                          onClick={() => {
                            const next = [...fileList];
                            [next[i], next[i + 1]] = [next[i + 1], next[i]];
                            setFileList(next);
                          }}
                        >
                          下移
                        </Button>
                        <span style={{ color: '#666', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis' }}>
                          {i + 1}. {f.name || '图片'}
                        </span>
                      </div>
                    ))}
                  </div>
                </Form.Item>
              )}
            </Form>
            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
              <Button type="primary" onClick={handleGenerate} loading={submitting}>
                生成纪念页
              </Button>
              <Button onClick={handleSimulate} loading={simulating}>
                模拟生成
              </Button>
            </div>
          </div>
          <div className="preview-panel">
            <div className="preview-title">实时预览</div>
            <MemorialCard data={previewData} />
          </div>
        </div>
      );
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    // ---------- 预览页（纪念页 + 扫码访问 + 二维码） ----------
    const QR_SIZE = 300;
    const QR_DOWNLOAD_SIZE = 300;

    function PreviewPage({ id }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const qrContainerRef = useRef(null);
      const qrInstanceRef = useRef(null);

      const previewUrl = window.location.origin + window.location.pathname + '#/preview?id=' + encodeURIComponent(id);

      useEffect(() => {
        let cancelled = false;
        const raw = window.localStorage.getItem(SIMULATE_PREFIX + id);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (!cancelled) setData(parsed);
          } catch {
            if (!cancelled) setError('数据解析失败');
          }
        } else {
          // 未配置 OSS 时仅支持模拟数据；配置后可在此请求 OSS 上的 memorial_{id}.json
          // fetch(OSS_CONFIG.jsonUrl(id)) ...
          if (!cancelled) setError('未找到该纪念页数据');
        }
        if (!cancelled) setLoading(false);
        return () => { cancelled = true; };
      }, [id]);

      useEffect(() => {
        if (!data || !qrContainerRef.current || !window.QRCode) return;
        qrContainerRef.current.innerHTML = '';
        const qr = new window.QRCode(qrContainerRef.current, {
          text: previewUrl,
          width: QR_SIZE,
          height: QR_SIZE,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: window.QRCode.CorrectLevel.H
        });
        qrInstanceRef.current = qr;
      }, [data, previewUrl]);

      const handleSaveQr = useCallback(() => {
        const container = qrContainerRef.current;
        if (!container) return;
        const canvas = container.querySelector('canvas');
        const img = container.querySelector('img');
        if (canvas) {
          const link = document.createElement('a');
          link.download = 'memorial-qrcode.png';
          const newCanvas = document.createElement('canvas');
          newCanvas.width = QR_DOWNLOAD_SIZE;
          newCanvas.height = QR_DOWNLOAD_SIZE;
          const ctx = newCanvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, QR_DOWNLOAD_SIZE, QR_DOWNLOAD_SIZE);
          ctx.drawImage(canvas, 0, 0, QR_SIZE, QR_SIZE, 0, 0, QR_DOWNLOAD_SIZE, QR_DOWNLOAD_SIZE);
          link.href = newCanvas.toDataURL('image/png');
          link.click();
        } else if (img) {
          const link = document.createElement('a');
          link.download = 'memorial-qrcode.png';
          link.href = img.src;
          link.click();
        }
      }, []);

      if (loading) {
        return (
          <div className="memorial-loading">
            <Spin size="large" />
            <span>加载纪念页…</span>
          </div>
        );
      }
      if (error || !data) {
        return (
          <div className="memorial-loading">
            <p>{error || '未找到数据'}</p>
            <Button type="primary" onClick={() => { window.location.hash = '/'; }}>返回编辑</Button>
          </div>
        );
      }

      const cardData = {
        name: data.name,
        birthDate: data.birthDate,
        deathDate: data.deathDate,
        biography: data.biography,
        photoList: data.photoUrls || []
      };

      return (
        <div className="memorial-preview-page">
          <div style={{ marginBottom: 16 }}>
            <Button type="link" onClick={() => { window.location.hash = '/'; }}>← 返回编辑</Button>
          </div>
          <div className="scan-hint">扫码访问</div>
          <div className="qr-area">
            <div id="qrcode-container" ref={qrContainerRef} />
            <Button className="save-qr-btn" onClick={handleSaveQr}>保存二维码</Button>
          </div>
          <MemorialCard data={cardData} />
        </div>
      );
    }

    // ---------- 根组件 + 路由 ----------
    function App() {
      const [path, setHash, getQueryId] = useHashRoute();
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const t = setTimeout(() => setReady(true), 300);
        return () => clearTimeout(t);
      }, []);

      const handleGenerate = (id) => {
        setHash('/preview', 'id=' + encodeURIComponent(id));
      };
      const handleSimulate = (id) => {
        setHash('/preview', 'id=' + encodeURIComponent(id));
      };

      if (!ready) {
        return (
          <div className="memorial-loading">
            <Spin size="large" />
            <span>加载中…</span>
          </div>
        );
      }

      if (path.path === '/preview') {
        const id = getQueryId();
        if (id) return <PreviewPage id={id} />;
      }

      return (
        <EditorPage onGenerate={handleGenerate} onSimulate={handleSimulate} />
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ConfigProvider theme={{ token: { fontFamily: 'var(--font-serif)' } }}>
        <App />
      </ConfigProvider>
    );
  </script>
</body>
</html>
